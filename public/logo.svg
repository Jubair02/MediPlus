<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t">
  <title id="t">MediPlus</title>
  <defs>
    <clipPath id="capsule">
      <rect x="-10" y="-4.5" width="20" height="9" rx="4.5" />
    </clipPath>
  </defs>

  <!-- Brand square: emerald-600, matching the logo mark in the header and footer. -->
  <rect width="32" height="32" rx="7" fill="#059669" />

  <!-- Two-tone capsule on the diagonal. Solid halves rather than the stroked lucide
       glyph: at a 16px favicon a 1px stroke disappears, while the tonal split still
       reads as a capsule. Sized so the tips clear the tile's rounded corners. -->
  <g transform="translate(16 16) rotate(-45)">
    <rect x="-10" y="-4.5" width="20" height="9" rx="4.5" fill="#ffffff" />
    <rect x="0" y="-4.5" width="10" height="9" fill="#6ee7b7" clip-path="url(#capsule)" />
  </g>
</svg>
